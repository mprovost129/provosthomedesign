<div class="field {% if field.errors %}has-error{% endif %}">
<div class="field-heading">{{ field.label_tag }}{% if field.field.required %}<span class="required">Required</span>{% endif %}</div>
{{ field }}
<div class="field-feedback">{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>
</div>
